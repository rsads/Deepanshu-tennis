<meta charset="UTF-8">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
background:#020913;
color:#fff;

}

body{

display:flex;
justify-content:center;
align-items:center;
position:relative;

}

/* Animated Background */

body::before{

content:'';
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle,#00ff8840,transparent 25%),
radial-gradient(circle,#00c8ff30,transparent 25%),
linear-gradient(135deg,#01040a,#061827,#020913);

background-size:350px 350px;

animation:bgmove 18s linear infinite;

z-index:-3;

}

@keyframes bgmove{

0%{transform:translate(0,0);}
50%{transform:translate(-120px,-80px);}
100%{transform:translate(0,0);}

}

/* Floating Balls */

.ball{

position:absolute;
border-radius:50%;
background:#d8ff00;
opacity:.18;
box-shadow:0 0 35px #d8ff00;

}

.ball1{

width:130px;
height:130px;
top:8%;
left:-50px;

animation:float1 8s infinite ease-in-out;

}

.ball2{

width:90px;
height:90px;
bottom:12%;
right:-20px;

animation:float2 7s infinite ease-in-out;

}

@keyframes float1{

50%{

transform:translateY(40px) rotate(180deg);

}

}

@keyframes float2{

50%{

transform:translateY(-35px) rotate(-180deg);

}

}

.wrapper{

width:95%;
max-width:420px;

background:rgba(255,255,255,.06);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.12);

border-radius:30px;

padding:20px;

box-shadow:0 0 40px rgba(0,255,136,.15);

}

/* Logo */

.logo{

width:95px;
height:95px;

display:block;

margin:auto;

border-radius:50%;

border:3px solid #00ff88;

box-shadow:0 0 25px #00ff88;

}

/* Badge */

.badge{

margin:15px auto;

display:table;

padding:8px 18px;

border-radius:30px;

font-size:12px;

font-weight:700;

background:#00ff88;

color:#000;

}

/* Title */

h1{

font-size:30px;

font-weight:800;

text-align:center;

line-height:1.15;

text-shadow:0 0 20px #00ff88;

animation:glow 2s infinite;

}

@keyframes glow{

50%{

text-shadow:

0 0 8px #00ff88,

0 0 18px #00ff88,

0 0 35px #00ff88;

}

}

.desc{

margin-top:12px;

text-align:center;

font-size:14px;

line-height:24px;

color:#ddd;

}

.desc span{

color:#00ff88;

font-weight:700;

}

/* Features */

.features{

margin-top:18px;

display:grid;

grid-template-columns:repeat(3,1fr);

gap:10px;

}

.box{

padding:14px 8px;

background:rgba(255,255,255,.05);

border-radius:15px;

text-align:center;

border:1px solid rgba(255,255,255,.08);

transition:.35s;

}

.box:hover{

transform:translateY(-6px);

box-shadow:0 0 20px rgba(0,255,136,.25);

}

.icon{

font-size:24px;

}

.box p{

margin-top:6px;

font-size:11px;

}

/* Counter */

.stats{

margin-top:18px;

display:grid;

grid-template-columns:repeat(3,1fr);

gap:10px;

}

.stat{

padding:14px;

text-align:center;

background:rgba(255,255,255,.05);

border-radius:15px;

}

.stat h2{

font-size:22px;

color:#00ff88;

}

.stat small{

font-size:11px;

color:#ccc;

}

/* Button */

.join{

margin-top:18px;

}

.join a{

display:block;

text-decoration:none;

padding:17px;

border-radius:50px;

text-align:center;

font-size:18px;

font-weight:800;

color:#000;

background:linear-gradient(90deg,#00ff88,#00d9ff);

box-shadow:0 0 30px rgba(0,255,136,.5);

animation:pulse 2s infinite;

}

@keyframes pulse{

50%{

transform:scale(1.03);

box-shadow:0 0 45px #00ff88;

}

}

.note{

margin-top:12px;

font-size:12px;

text-align:center;

color:#aaa;

}

/* Popup */

.popup{

position:fixed;

left:15px;

bottom:15px;

padding:10px 15px;

border-radius:12px;

background:#111;

border:1px solid #00ff88;

display:none;

font-size:13px;

box-shadow:0 0 20px rgba(0,255,136,.3);

}

@media(max-width:390px){

.wrapper{

padding:16px;

}

h1{

font-size:25px;

}

.join a{

font-size:16px;

padding:15px;

}

}

</style>

</head>

<body>

<div class="ball ball1"></div>
<div class="ball ball2"></div>

<div class="wrapper">

<img src="logo.png" class="logo">

<div class="badge">
ATP • WTA • GRAND SLAM
</div>

<h1>
DEEPANSHU<br>
TENNIS EXPERT™
</h1>

<div class="desc">

<span>Professional Tennis Analysis</span><br>

Daily Expert Picks • Live Updates • Premium Community

</div>

<div class="features">

<div class="box">

<div class="icon">🎾</div>

<p>Expert Picks</p>

</div>

<div class="box">

<div class="icon">⚡</div>

<p>Fast Updates</p>

</div>

<div class="box">

<div class="icon">🏆</div>

<p>Grand Slam</p>

</div>

</div>

<div class="stats">

<div class="stat">

<h2 id="m1">0</h2>

<small>Matches</small>

</div>

<div class="stat">

<h2 id="m2">0</h2>

<small>Accuracy</small>

</div>

<div class="stat">

<h2 id="m3">0</h2>

<small>Members</small>

</div>

</div>

<div class="join">

<a href="https://t.me/+_IHVaeoStyA5MTI1" target="_blank">

🚀 JOIN VIP TELEGRAM

</a>

</div>

<div class="note">

Play Smart • Stay Ahead

</div>

</div>

<div class="popup" id="popup"></div>

<script>

const popup=document.getElementById("popup");

const users=[
"Aman",
"Rohit",
"Rahul",
"Deepak",
"Vikas",
"Ankit",
"Vivek",
"Abhishek",
"Sumit",
"Karan"
];

function livePopup(){

const user=users[Math.floor(Math.random()*users.length)];

popup.innerHTML="🎉 "+user+" joined VIP";

popup.style.display="block";

setTimeout(()=>{

popup.style.display="none";

},3000);

}

setInterval(livePopup,5000);

function counter(id,end,suffix){

let i=0;

const el=document.getElementById(id);

const timer=setInterval(()=>{

i++;

el.innerHTML=i+suffix;

if(i>=end){

clearInterval(timer);

}

},20);

}

counter("m1",100,"0+");
counter("m2",88,"%");
counter("m3",12,"K+");
window.addEventListener("load",()=>{

setTimeout(livePopup,1200);

});

/* ========= Mouse Glow ========= */

const glow=document.createElement("div");

glow.style.cssText=`
position:fixed;
width:180px;
height:180px;
border-radius:50%;
pointer-events:none;
background:radial-gradient(circle,rgba(0,255,136,.22),transparent 70%);
transform:translate(-50%,-50%);
z-index:0;
transition:.08s linear;
`;

document.body.appendChild(glow);

document.addEventListener("mousemove",e=>{

glow.style.left=e.clientX+"px";
glow.style.top=e.clientY+"px";

});

/* ========= Button Shine ========= */

const btn=document.querySelector(".join a");

btn.style.position="relative";
btn.style.overflow="hidden";

const shine=document.createElement("span");

shine.style.cssText=`
position:absolute;
top:0;
left:-120%;
width:60%;
height:100%;
background:rgba(255,255,255,.35);
transform:skewX(-25deg);
`;

btn.appendChild(shine);

setInterval(()=>{

shine.animate([
{left:"-120%"},
{left:"170%"}
],{

duration:1200,
easing:"ease"

});

},2200);

/* ========= Card Animation ========= */

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.animate([

{
opacity:0,
transform:"translateY(40px)"
},

{
opacity:1,
transform:"translateY(0)"
}

],{

duration:700,
fill:"forwards"

});

}

});

});

document.querySelectorAll(".box,.stat,.join,.badge,.logo,.desc,h1").forEach(el=>{

observer.observe(el);

});

/* ========= Floating Effect ========= */

document.querySelectorAll(".box").forEach((box,index)=>{

box.animate([

{
transform:"translateY(0px)"
},

{
transform:"translateY(-8px)"
},

{
transform:"translateY(0px)"
}

],{

duration:2500+(index*300),

iterations:Infinity,

easing:"ease-in-out"

});

});

/* ========= Background Sparkles ========= */

for(let i=0;i<18;i++){

let star=document.createElement("div");

star.style.position="fixed";

star.style.width="3px";

star.style.height="3px";

star.style.borderRadius="50%";

star.style.background="#00ff88";

star.style.opacity=Math.random();

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

star.style.boxShadow="0 0 10px #00ff88";

star.animate([

{
transform:"translateY(0px)",
opacity:.2
},

{
transform:"translateY(-40px)",
opacity:1
},

{
transform:"translateY(0px)",
opacity:.2
}

],{

duration:3000+Math.random()*4000,

iterations:Infinity

});

document.body.appendChild(star);

}

</script>

</body>
</html>
